services:
  - type: web
    name: foodnest-fullstack-syedaiman1708
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: foodnest-orders
      mountPath: /opt/render/project/src/.foodnest
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: FOODNEST_STORAGE_DIR
        value: /opt/render/project/src/.foodnest
      - key: CORS_ORIGINS
        value: https://syedaiman1708.github.io,https://foodnest-fullstack-syedaiman1708.onrender.com
