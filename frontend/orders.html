<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodNest | Orders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">F</div>
        <span>FoodNest</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="menu.html">Menu Management</a>
        <a class="active" href="orders.html">Orders</a>
        <a href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="waste.html">Food Waste</a>
        <a href="reports.html">Reports & Analytics</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" type="button">Logout</button>
      </nav>
    </aside>

    <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
    <main class="content-panel">
      <header class="top-header">
        <div>
          <p class="eyebrow accent">Operations</p>
          <h1>Order Management</h1>
        </div>
        <div class="header-tools">
          <button class="btn btn-primary" type="button" id="addFoodOrderButton">Add Food Order</button>
          <div class="search-box small">
            <input id="orderSearch" type="text" placeholder="Search order" />
          </div>
          <select id="statusFilter">
            <option value="all">All Orders</option>
            <option value="Pending">Pending</option>
            <option value="Preparing">Preparing</option>
            <option value="Ready">Ready</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </header>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Date</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="orderTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog class="modal" id="foodOrderDialog" aria-labelledby="foodOrderDialogTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="foodOrderDialogTitle">Add Food Order</h2>
          <button class="modal-close" type="button" data-close-order-dialog aria-label="Close dialog">&times;</button>
        </div>
        <form id="foodOrderForm" class="grid-form">
          <label class="full-span">
            <span>Customer</span>
            <select id="foodOrderCustomer" required></select>
          </label>
          <div class="full-span">
            <div class="panel-header">
              <h3>Food items</h3>
              <button class="btn btn-secondary" type="button" id="addOrderItemButton">Add another food</button>
            </div>
            <div class="order-item-list" id="orderItemList"></div>
          </div>
          <p class="order-form-total full-span">Order total: <strong id="foodOrderTotal">₹0</strong></p>
          <div class="submit-row full-span">
            <button type="submit" class="btn btn-primary">Save Food Order</button>
            <button type="button" class="btn btn-secondary" data-close-order-dialog>Cancel</button>
          </div>
        </form>
      </div>
    </dialog>

    <script src="./js/app.js"></script>
    <script src="./js/orders.js"></script>
  </body>
</html>
