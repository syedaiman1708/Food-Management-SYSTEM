<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodNest | Customers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">F</div>
        <span>FoodNest</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="menu.html">Menu Management</a>
        <a href="orders.html">Orders</a>
        <a href="inventory.html">Inventory</a>
        <a class="active" href="customers.html">Customers</a>
        <a href="waste.html">Food Waste</a>
        <a href="reports.html">Reports & Analytics</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" type="button">Logout</button>
      </nav>
    </aside>

    <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
    <main class="content-panel">
      <header class="top-header">
        <div>
          <p class="eyebrow accent">Customers</p>
          <h1>Customer Management</h1>
        </div>
        <div class="header-tools">
          <div class="search-box small">
            <input id="customerSearch" type="text" placeholder="Search customer" />
          </div>
          <button class="btn btn-primary" type="button" id="addCustomerButton">Add Customer</button>
        </div>
      </header>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Contact</th>
                <th>Orders</th>
                <th>Total Spend</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog class="modal" id="customerDialog" aria-labelledby="customerDialogTitle">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="customerDialogTitle">Add customer</h2>
          <button class="modal-close" type="button" data-close-dialog aria-label="Close dialog">&times;</button>
        </div>
        <form id="customerForm" class="grid-form">
          <label class="full-span">
            <span>Name</span>
            <input id="customerName" name="name" type="text" maxlength="120" autocomplete="name" required />
          </label>
          <label class="full-span">
            <span>Email</span>
            <input id="customerEmail" name="email" type="email" maxlength="120" autocomplete="email" required />
          </label>
          <label class="full-span">
            <span>Phone</span>
            <input id="customerPhone" name="phone" type="tel" maxlength="30" autocomplete="tel" required />
          </label>
          <div class="submit-row full-span">
            <button type="submit" class="btn btn-primary">Save Customer</button>
            <button type="button" class="btn btn-secondary" data-close-dialog>Cancel</button>
          </div>
        </form>
        <dl class="customer-details" id="customerDetails" hidden></dl>
      </div>
    </dialog>

    <script src="./js/app.js"></script>
    <script src="./js/customers.js"></script>
  </body>
</html>
