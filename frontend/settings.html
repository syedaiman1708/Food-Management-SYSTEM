<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodNest | Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">F</div>
        <span>FoodNest</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="menu.html">Menu Management</a>
        <a href="orders.html">Orders</a>
        <a href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="waste.html">Food Waste</a>
        <a href="reports.html">Reports & Analytics</a>
        <a class="active" href="settings.html">Settings</a>
        <button class="logout-btn" type="button">Logout</button>
      </nav>
    </aside>

    <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
    <main class="content-panel">
      <header class="top-header">
        <div>
          <p class="eyebrow accent">Workspace</p>
          <h1>Settings</h1>
        </div>
        <a class="btn btn-secondary settings-back" href="dashboard.html">Back to dashboard</a>
      </header>

      <section class="panel settings-panel">
        <div class="panel-header">
          <h3>Restaurant profile</h3>
        </div>
        <form id="settingsForm" class="grid-form">
          <label>
            <span>Restaurant name</span>
            <input type="text" id="restaurantName" name="restaurantName" required />
          </label>
          <label>
            <span>Contact email</span>
            <input type="email" id="contactEmail" name="contactEmail" required />
          </label>
          <label>
            <span>Phone number</span>
            <input type="tel" id="contactPhone" name="contactPhone" />
          </label>
          <label>
            <span>Currency</span>
            <select id="currency" name="currency">
              <option value="INR">Indian Rupee (₹)</option>
              <option value="USD">US Dollar ($)</option>
              <option value="EUR">Euro (€)</option>
            </select>
          </label>
          <label class="check-inline full-span">
            <input type="checkbox" id="stockNotifications" name="stockNotifications" />
            Show low-stock notifications
          </label>
          <div class="submit-row full-span">
            <button type="submit" class="btn btn-primary">Save settings</button>
            <button type="reset" class="btn btn-secondary" id="resetSettings">Reset</button>
          </div>
        </form>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/settings.js"></script>
  </body>
</html>
