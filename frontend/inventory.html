<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodNest | Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">F</div>
        <span>FoodNest</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="menu.html">Menu Management</a>
        <a href="orders.html">Orders</a>
        <a class="active" href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="waste.html">Food Waste</a>
        <a href="reports.html">Reports & Analytics</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" type="button">Logout</button>
      </nav>
    </aside>

    <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
    <main class="content-panel">
      <header class="top-header">
        <div>
          <p class="eyebrow accent">Inventory</p>
          <h1>Ingredient Management</h1>
        </div>
        <div class="header-tools">
          <div class="search-box small">
            <input id="inventorySearch" type="text" placeholder="Search ingredients" />
          </div>
          <button class="btn btn-primary" type="button" id="showIngredientForm">Add Ingredient</button>
        </div>
      </header>

      <section class="panel tools-panel">
        <div class="panel-header">
          <h3>Ingredient form</h3>
        </div>
        <form id="ingredientForm" class="grid-form">
          <input type="hidden" id="ingredientId" />
          <label>
            <span>Name</span>
            <input type="text" id="ingredientName" required />
          </label>
          <label>
            <span>Category</span>
            <input type="text" id="ingredientCategory" required />
          </label>
          <label>
            <span>Quantity</span>
            <input type="number" id="ingredientQty" step="0.01" min="0" required />
          </label>
          <label>
            <span>Unit</span>
            <input type="text" id="ingredientUnit" required />
          </label>
          <label>
            <span>Minimum Threshold</span>
            <input type="number" id="ingredientThreshold" step="0.01" min="0" required />
          </label>
          <label>
            <span>Supplier ID</span>
            <input type="number" id="ingredientSupplier" required />
          </label>
          <label>
            <span>Expiry Date</span>
            <input type="date" id="ingredientExpiry" />
          </label>
          <div class="submit-row full-span">
            <button type="submit" class="btn btn-primary">Save Ingredient</button>
            <button type="button" class="btn btn-secondary" id="cancelIngredientEdit">Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ingredient</th>
                <th>Category</th>
                <th>Qty</th>
                <th>Unit</th>
                <th>Threshold</th>
                <th>Supplier</th>
                <th>Expiry</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/inventory.js"></script>
  </body>
</html>
