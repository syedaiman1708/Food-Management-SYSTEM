<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodNest | Menu Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">F</div>
        <span>FoodNest</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="menu.html">Menu Management</a>
        <a href="orders.html">Orders</a>
        <a href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="waste.html">Food Waste</a>
        <a href="reports.html">Reports & Analytics</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" type="button">Logout</button>
      </nav>
    </aside>

    <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
    <main class="content-panel">
      <header class="top-header">
        <div>
          <p class="eyebrow accent">Operations</p>
          <h1>Menu Management</h1>
        </div>
        <div class="header-tools">
          <div class="search-box small">
            <input id="menuSearch" type="text" placeholder="Search menu" />
          </div>
          <button class="btn btn-primary" type="button" id="showAddForm">Add Food Item</button>
        </div>
      </header>

      <section class="panel tools-panel">
        <div class="panel-header">
          <h3>Food item form</h3>
        </div>
        <form id="menuForm" class="grid-form">
          <input type="hidden" id="menuId" />
          <label>
            <span>Name</span>
            <input type="text" id="menuName" required />
          </label>
          <label>
            <span>Category</span>
            <select id="menuCategory"></select>
          </label>
          <label>
            <span>Price</span>
            <input type="number" id="menuPrice" step="0.01" required />
          </label>
          <label>
            <span>Image URL</span>
            <input type="url" id="menuImage" placeholder="https://..." />
          </label>
          <label class="full-span">
            <span>Description</span>
            <textarea id="menuDescription" rows="3" required></textarea>
          </label>
          <label class="check-inline">
            <input type="checkbox" id="menuAvailable" checked />
            Available
          </label>
          <div class="submit-row full-span">
            <button type="submit" class="btn btn-primary">Save Item</button>
            <button type="button" class="btn btn-secondary" id="cancelMenuEdit">Cancel</button>
          </div>
        </form>
      </section>

      <section class="menu-grid" id="menuGrid"></section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/menu.js"></script>
  </body>
</html>
