<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodNest | Reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">F</div>
        <span>FoodNest</span>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="menu.html">Menu Management</a>
        <a href="orders.html">Orders</a>
        <a href="inventory.html">Inventory</a>
        <a href="customers.html">Customers</a>
        <a href="waste.html">Food Waste</a>
        <a class="active" href="reports.html">Reports & Analytics</a>
        <a href="settings.html">Settings</a>
        <button class="logout-btn" type="button">Logout</button>
      </nav>
    </aside>

    <button class="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰ Menu</button>
    <main class="content-panel">
      <header class="top-header">
        <div>
          <p class="eyebrow accent">Analytics</p>
          <h1>Reports & Analytics</h1>
        </div>
        <div class="header-tools">
          <button class="btn btn-primary" id="downloadCsv" type="button">Export CSV</button>
        </div>
      </header>

      <section class="summary-grid" id="reportCards"></section>

      <section class="content-grid dashboard-grid">
        <div class="panel panel-large">
          <div class="panel-header">
            <h3>Paid sales trend</h3>
            <select id="reportPeriod" aria-label="Sales report period">
              <option value="30">Last 30 days</option>
              <option value="7">Last 7 days</option>
              <option value="90">Last 90 days</option>
            </select>
          </div>
          <div class="chart-container">
            <canvas id="reportChart" aria-label="Daily paid sales chart" role="img"></canvas>
          </div>
        </div>
        <div class="panel">
          <div class="panel-header">
            <h3>Best-selling items (all time)</h3>
          </div>
          <div id="bestSellingList" class="list-stack"></div>
        </div>
      </section>
    </main>

    <script src="./js/app.js"></script>
    <script src="./js/reports.js"></script>
  </body>
</html>
